steps:
- name: python:3.14-slim
  entrypoint: python3
  args: ['scripts/fetch-dem.py', 'dem']
- name: gcr.io/cloud-builders/docker
  args:
  - build
  - -t
  - $_IMAGE_NAME
  - .
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - $_IMAGE_NAME
- name: gcr.io/cloud-builders/gcloud
  args:
  - run
  - deploy
  - $_SERVICE_NAME
  - --image=$_IMAGE_NAME
  - --region=$_REGION
  - --platform=managed

# Downloads ~270 MB from tgos.tw and builds a 755 MiB image.
timeout: 2400s
